<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070B16">
<title>Development hour admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='10' fill='%235F6CE3'/><rect x='9' y='19' width='4.5' height='8' rx='2' fill='white'/><rect x='15.75' y='14' width='4.5' height='13' rx='2' fill='white'/><rect x='22.5' y='8' width='4.5' height='19' rx='2' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.mark.admin { background: linear-gradient(145deg, #9AA4FF, #5461DA); }
.tag { font-family: var(--body); font-size: .6875rem; font-weight: 700; color: var(--brand-ink); background: var(--brand-soft); border-radius: 6px; padding: 2px 8px; margin-left: 4px; vertical-align: middle; }
.actions { display: flex; gap: 6px; align-items: center; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login form { width: min(380px, 100%); background: linear-gradient(180deg, #161F3D, #0F172F); border: 1px solid var(--line-strong); border-radius: 24px; box-shadow: var(--lift); padding: 30px 26px; }
.login h1 { margin: 18px 0 6px; font-family: var(--display); font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
.login p { margin: 0 0 20px; color: var(--muted); }
.login label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: 6px; }
.login .field { width: 100%; }
.login .btn { width: 100%; margin-top: 14px; }
.login .err { color: var(--danger); font-size: .875rem; margin: 10px 0 0; min-height: 1.3em; }

/* panels */
.panel { background: linear-gradient(180deg, rgba(22, 31, 62, .95), rgba(14, 21, 43, .95)); border: 1px solid var(--line-strong); border-radius: 22px; box-shadow: var(--lift); padding: 20px; margin-bottom: 18px; }
.panel > h2 { margin: 0; font-family: var(--display); font-size: 1.0625rem; font-weight: 700; letter-spacing: -.01em; }
.panel > .hint { margin: 2px 0 16px; color: var(--muted); font-size: .875rem; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.bar .grow { flex: 1 1 180px; }
.bar label { font-size: .8125rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }

.table { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 4.25rem) 3.5rem; gap: 8px 8px; align-items: center; }
.table.goals { grid-template-columns: minmax(0, 1fr) repeat(3, 4.25rem) 2.75rem; }
.th { font-size: .75rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: flex-end; gap: 5px; padding-bottom: 2px; }
.th.left { justify-content: flex-start; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .av { width: 34px; height: 34px; font-size: .8125rem; }
.who span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .field { min-width: 0; width: 100%; }
.table .field[type=number] { width: 100%; padding: 8px; }
.pct { text-align: right; font-family: var(--display); font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.pct.hit { color: var(--win); }
.pct.some { color: var(--ink); }
.dim { opacity: .55; }
@media (max-width: 560px) {
  .panel { padding: 16px 14px; border-radius: 18px; }
  .table { grid-template-columns: repeat(3, minmax(0, 1fr)) 3.25rem; gap: 6px 8px; }
  .table.goals { grid-template-columns: repeat(3, minmax(0, 1fr)) 2.75rem; }
  .table .th.left { display: none; }
  .table .who { grid-column: 1 / -1; margin-top: 10px; }
  .table .who .av { width: 28px; height: 28px; font-size: .6875rem; }
  .addrow .table .who { margin-top: 0; }
  .brand h1 { font-size: 1.125rem; }
}
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--faint); display: grid; place-items: center; justify-self: end; }
.iconbtn:hover { background: var(--soft); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
.addrow { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.archived { margin-top: 16px; }
.archived summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .875rem; padding: 6px 0; }
.arch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.arch-row .who { flex: 1; }
.empty-note { border: 1px dashed var(--line-strong); background: var(--soft); border-radius: 14px; padding: 16px; color: var(--muted); font-size: .9375rem; }

/* status */
.status {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20;
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
  background: var(--raise); border: 1px solid var(--line-strong); box-shadow: var(--lift); font-size: .875rem; font-weight: 600; color: var(--muted);
  transition: opacity .3s;
}
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--win); }
.status.saving i { background: var(--brand); animation: blink 1s infinite; }
.status.error { color: var(--danger); }
.status.error i { background: var(--danger); }
.status.idle { opacity: 0; pointer-events: none; }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status.saving i { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="status idle" id="status" role="status" aria-live="polite"><i></i><span>All changes saved</span></div>
<script src="/shared.js"></script>
<script src="/admin.js"></script>
</body>
</html>
